<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Y.X.网盘地址发布页</title>
    <link rel="icon" href="https://files.bananayx.qzz.io/img/Banana%E5%A4%B4%E5%83%8F.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --md-bg: #f5f5f7;
            --md-surface: #ffffff;
            --md-primary: #1976d2;
            --md-on-primary: #ffffff;
            --md-secondary: #9c27b0;
            --md-on-surface: #1d1d1f;
            --md-on-surface-variant: #3a3a3c;
            --md-elevation: 0 4px 20px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.06);
            --md-radius: 16px;
            --md-font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --logo-light-display: block;
            --logo-dark-display: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-bg: #0f0f11;
                --md-surface: #1c1c1e;
                --md-primary: #90caf9;
                --md-on-primary: #0f0f11;
                --md-secondary: #ce93d8;
                --md-on-surface: #e8e8ea;
                --md-on-surface-variant: #a8a8aa;
                --md-elevation: 0 4px 20px rgba(0, 0, 0, 0.40), 0 2px 6px rgba(0, 0, 0, 0.20);
                --logo-light-display: none;
                --logo-dark-display: block;
            }
        }

        body {
            font-family: var(--md-font);
            background: var(--md-bg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
            margin: 0;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--md-radius);
            box-shadow: var(--md-elevation);
            padding: 32px 28px 28px;
            max-width: 480px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                background: rgba(28, 28, 30, 0.72);
                border-color: rgba(255, 255, 255, 0.1);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--md-primary);
            transition: border-color 0.3s ease;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            height: 32px;
        }

        .logo {
            height: 32px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .logo-light {
            display: var(--logo-light-display);
        }

        .logo-dark {
            display: var(--logo-dark-display);
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--md-primary);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
            line-height: 1.2;
            white-space: nowrap;
        }

        .url-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }

        .url-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.04);
            transition: background 0.3s ease, transform 0.15s ease;
        }

        .url-item:hover {
            transform: translateY(-1px);
            background: rgba(0, 0, 0, 0.08);
        }

        .url-badge {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 2px 10px;
            border-radius: 20px;
            flex-shrink: 0;
            background: var(--md-primary);
            color: var(--md-on-primary);
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        .url-badge.secondary {
            background: var(--md-secondary);
            color: var(--md-on-primary);
        }

        .url-link {
            font-size: 16px;
            font-weight: 500;
            color: var(--md-on-surface);
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s ease;
            flex: 1;
            min-width: 0;
            line-height: 1.4;
        }

        .url-link.primary-link {
            color: var(--md-primary);
            font-weight: 600;
        }

        .url-link.primary-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .url-link.secondary-link {
            color: var(--md-secondary);
        }

        .url-link.secondary-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
            color: color-mix(in srgb, var(--md-secondary) 80%, #000 20%);
        }

        .url-link:hover {
            color: var(--md-primary);
        }

        .card-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid color-mix(in srgb, var(--md-on-surface) 12%, transparent);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: border-color 0.3s ease;
        }

        .footer-hint {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            letter-spacing: 0.2px;
            font-weight: 400;
            opacity: 0.8;
            transition: color 0.3s ease;
        }

        .footer-hint span {
            display: inline-block;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 18px 20px;
            }

            .card-header {
                gap: 10px;
                padding-bottom: 14px;
                margin-bottom: 18px;
            }

            .logo {
                height: 26px;
            }

            .logo-wrap {
                height: 26px;
            }

            .card-title {
                font-size: 22px;
            }

            .url-item {
                padding: 8px 12px;
                gap: 10px;
                border-radius: 10px;
            }

            .url-badge {
                font-size: 11px;
                padding: 1px 8px;
            }

            .url-link {
                font-size: 14px;
            }

            .card-footer {
                margin-top: 18px;
                padding-top: 12px;
                gap: 12px;
            }

            .footer-hint {
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 18px 14px 16px;
            }

            .logo {
                height: 20px;
            }

            .logo-wrap {
                height: 20px;
            }

            .card-title {
                font-size: 18px;
            }

            .url-item {
                padding: 6px 10px;
                gap: 8px;
            }

            .url-badge {
                font-size: 10px;
                padding: 1px 6px;
            }

            .url-link {
                font-size: 13px;
            }
        }

        @media (prefers-color-scheme: dark) {
            .url-item {
                background: rgba(255, 255, 255, 0.05);
            }

            .url-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .url-link.secondary-link:hover {
                color: color-mix(in srgb, var(--md-secondary) 80%, #fff 20%);
            }

            .url-link:hover {
                color: var(--md-primary);
            }
        }
    </style>
</head>
<body>
    <div class="card" role="main" aria-label="地址发布卡片">
        <div class="card-header">
            <span class="logo-wrap">
                <img class="logo logo-light" src="https://byxpan.qzz.io/img/Banana%20Y.X.%E7%BD%91%E7%9B%98%E9%BB%91%E5%AD%97.png" alt="Banana Y.X.网盘">
                <img class="logo logo-dark" src="https://byxpan.qzz.io/img/Banana%20Y.X.%E7%BD%91%E7%9B%98%E7%99%BD%E5%AD%97.png" alt="Banana Y.X.网盘">
            </span>
            <span class="card-title">地址发布页</span>
        </div>

        <div class="url-section">
            <div class="url-item">
                <span class="url-badge">主</span>
                <a class="url-link primary-link" href="https://www.byxpan.qzz.io/" target="_blank" rel="noopener noreferrer">https://www.byxpan.qzz.io/</a>
            </div>
            <div class="url-item">
                <span class="url-badge secondary">备1</span>
                <a class="url-link secondary-link" href="http://lsj.2.frp.one:31523/" target="_blank" rel="noopener noreferrer">http://lsj.2.frp.one:31523/</a>
            </div>
            <div class="url-item">
                <span class="url-badge secondary">备2</span>
                <a class="url-link secondary-link" href="http://it.frp.one:35854/" target="_blank" rel="noopener noreferrer">http://it.frp.one:35854/</a>
            </div>
        </div>

        <div class="card-footer">
            <span class="footer-hint">📌 请收藏本页 · 及时获取最新地址</span>
        </div>
    </div>
    <script>
        fetch('http://www.wudada.online/Api/ScTp')
            .then(res => res.json())
            .then(data => {
                if (data && data.data) {
                    document.body.style.backgroundImage = 'url(' + data.data + ')';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
